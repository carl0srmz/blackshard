version: 2

# Every dependency change is reviewed by a person before it merges; nothing here is auto-merged.
# blackshard ships a SYSTEM service and a kernel driver, so a compromised release of any crate,
# action or package would reach every install.
#
# `cooldown` holds version updates back until a release has been public for a week, which is when
# most malicious or broken releases get noticed and yanked. Security updates ignore the cooldown
# and arrive as soon as an advisory is published.
#
# Cargo updates are lockfile-only: Dependabot moves Cargo.lock within the ranges Cargo.toml already
# allows, and never rewrites Cargo.toml. Dependabot calls a 0.x bump such as sha2 0.10 -> 0.11
# "minor", although Cargo treats it as breaking, so it used to open upgrades that could not compile.
# Breaking upgrades are made by hand, together with the code they need.

updates:
  # Only the root. The fuzz crate depends on nothing but blackshard itself, so watching /fuzz as
  # well opened every root update a second time.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:23"
      timezone: America/Mexico_City
    open-pull-requests-limit: 3
    rebase-strategy: auto
    versioning-strategy: lockfile-only
    cooldown:
      default-days: 7
    groups:
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"
      rust-compatible:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  # The Rust release in rust-toolchain.toml. Each new stable arrives as its own pull request, where
  # CI shows any new clippy lints or rustfmt changes before they can reach main.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:33"
      timezone: America/Mexico_City
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:43"
      timezone: America/Mexico_City
    open-pull-requests-limit: 1
    rebase-strategy: auto
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directories:
      - /installer/package
      - /installer/bundle
    schedule:
      interval: weekly
      day: monday
      time: "06:03"
      timezone: America/Mexico_City
    open-pull-requests-limit: 1
    rebase-strategy: auto
    cooldown:
      default-days: 7
    groups:
      wix:
        patterns:
          - "*"
