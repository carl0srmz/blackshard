[workspace]
members = [
    ".",
    "blackshard-amsi"
]

[package]
name = "blackshard"
version = "0.1.0"
edition = "2021"
description = "Open-source adaptive antivirus agent for Windows"
license-file = "LICENSE"
repository = "https://github.com/carlosrmz009/blackshard"
publish = false

[[bin]]
name = "blackshard-service"
path = "src/bin/blackshard-service.rs"

[[bin]]
name = "blackshard-ui"
path = "src/bin/blackshard-ui.rs"

[dependencies]
windows-sys = { version = "0.52.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell"] }
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
wgpu = { version = "30.0", default-features = false, features = ["dx12"] }
chrono = { version = "0.4.38", features = ["serde"] }
goblin = "0.10.7"
sha2 = "0.11.0"
cfb = "0.15.0"
ed25519-dalek = "3.0.0"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
hex = "0.4.3"
base64 = "0.22.1"
rand = "0.10.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
uuid = { version = "1.10", features = ["serde", "v4"] }
walkdir = "2.5"
# Module features are opt-in. `pe`, `dotnet` and `hash` are required by the public rule
# collections blackshard imports (YARA-Forge and Elastic); `console`, `math`, `string` and `time`
# carry no extra dependencies and are widely used by the same rulesets.
yara-x = { version = "1.19.0", default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp", "console-module", "dotnet-module", "hash-module", "math-module", "pe-module", "string-module", "time-module"] }
zip = { version = "8.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ureq = { version = "2.9.6", default-features = false, features = ["tls"] }
log = "0.4.33"
env_logger = "0.11.11"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
hkdf = "0.13"
md-5 = "0.11"
num-bigint = "0.5"

[target.'cfg(windows)'.dependencies]
winrt-notification = { package = "tauri-winrt-notification", version = "0.8.1" }
windows-service = "0.8.1"

[dev-dependencies]
tempfile = "3.12"
